name: Discord Commit Notifier

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send commits to Discord
        run: |
          COMMITS=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[] | "- \(.message)"')

          curl -H "Content-Type: application/json" \
          -d "{\"content\":\"🚀 **New Push by ${{ github.actor }}**\\n\\n📦 **Commits:**\\n$COMMITS\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}
