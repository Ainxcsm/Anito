name: Discord Commit Notifier

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send commits to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          COMMITS=$(echo "$COMMITS_JSON" | jq -r '.[] | "```" + .message + "```"')

          MESSAGE="**New Push by $GITHUB_ACTOR**

          **Commits:**
          $COMMITS

          ━━━━━━━━━━━━━━
          **DEV REMINDER**
          • git pull before opening the project
          • git add .
          • git commit -m \"message\"
          • git push

          @everyone"

          jq -n --arg content "$MESSAGE" '{content: $content}' > payload.json

          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "$DISCORD_WEBHOOK"
